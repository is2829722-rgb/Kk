# Game VM Manager — Free Fire + Roblox

Projeto Windows Forms em C#/.NET 8. A interface:
- inicia e solicita o desligamento de uma VM Android já criada no VirtualBox;
- abre Roblox instalado no Windows (nativo), ou permite localizar o executável.

## Importante sobre compatibilidade
Este é um gerenciador, não um emulador Android. A VM não é instalada automaticamente. Free Fire pode não funcionar em VirtualBox/Android-x86, e não há garantia de compatibilidade ou desempenho. Para jogar Roblox no Windows, o aplicativo abre a versão nativa instalada; não tenta executar Roblox dentro da VM Android.

## Requisitos
- Windows 10/11 64-bit.
- .NET 8 SDK para compilar.
- Oracle VirtualBox apenas se for usar a função de VM Android.
- Uma VM Android já configurada e testada, com o nome que você informar.

## Preparar Android VM (opcional)
1. Instale VirtualBox: https://www.virtualbox.org/wiki/Downloads
2. Obtenha Android-x86: https://www.android-x86.org/download
3. Siga a documentação de instalação em VM: https://www.android-x86.org/documentation/virtualbox.html
4. Crie a VM e anote o nome exato. A compatibilidade com Free Fire não é garantida.

## Instalar Roblox
Instale Roblox pelo site oficial: https://www.roblox.com/download
Depois, no programa, clique em **Localizar Roblox** e selecione `RobloxPlayerBeta.exe`, se a detecção automática não encontrar.

## Compilar
Instale o .NET 8 SDK: https://dotnet.microsoft.com/download/dotnet/8.0
Abra PowerShell nesta pasta e rode:
```powershell
dotnet restore
dotnet build -c Release
```
Executável de build:
`bin\Release\net8.0-windows\GameVMManager.exe`

## Publicar um .exe independente
```powershell
dotnet publish -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true
```
O executável final ficará em:
`bin\Release\net8.0-windows\win-x64\publish\GameVMManager.exe`
